[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arab-football-unified-api"
version = "0.1.0"
description = "An open football data engine for the Arab world — code (MIT) + monthly database snapshots (ODbL)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
# Ruff is pinned to a minor range: an unpinned linter silently gains rules and
# turns a green local run into a red CI one.
dev = ["pytest>=8.0", "ruff>=0.14,<0.15"]

[project.urls]
Homepage = "https://github.com/MHutatah/arab-football-unified-api"

[tool.setuptools.packages.find]
include = ["arabfootball*"]

[tool.setuptools.package-data]
"arabfootball.store" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Selected explicitly so the rule set is a property of the repo, not of whichever
# ruff version happens to be installed.
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
